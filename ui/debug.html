<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSnap — AI Agent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e0e6ed;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 30px;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
      color: #fff;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 14px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .panel {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 20px;
    }

    .panel h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #fff;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 500;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      background: #0f1419;
      border: 1px solid #2d3748;
      border-radius: 4px;
      color: #e0e6ed;
      font-family: 'Monaco', monospace;
      font-size: 13px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #4339ca;
    }

    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }

    .output {
      background: #0f1419;
      border: 1px solid #2d3748;
      border-radius: 4px;
      padding: 15px;
      margin-top: 10px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Monaco', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output.error {
      color: #ef4444;
      border-color: #7f1d1d;
      background: #7f1d1d20;
    }

    .output.success {
      color: #10b981;
      border-color: #065f46;
      background: #065f4620;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #4f46e5;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 30px;
    }

    .status-item {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .status-label {
      color: #9ca3af;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .status-value {
      font-size: 16px;
      font-weight: bold;
      color: #10b981;
    }

    .status-value.error {
      color: #ef4444;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
      .status-bar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔧 CodeSnap Agent</h1>
      <p class="subtitle">Local AI agent with Ollama, GitHub, and file system access</p>
    </header>

    <div class="main-grid">
      <!-- Chat Panel -->
      <div class="panel">
        <h2>💬 Chat</h2>
        <div class="form-group">
          <label>Message</label>
          <textarea id="chatInput" placeholder="Ask me anything..."></textarea>
        </div>
        <button id="sendChat" onclick="sendChat()">Send Message</button>
        <div id="chatOutput" class="output"></div>
      </div>

      <!-- Image Generation Panel -->
      <div class="panel">
        <h2>🎨 Image Generator</h2>
        <div class="form-group">
          <label>Prompt</label>
          <textarea id="imagePrompt" placeholder="Describe the image you want..."></textarea>
        </div>
        <button id="generateImage" onclick="generateImage()">Generate Image</button>
        <div id="imageOutput" class="output"></div>
      </div>
    </div>

    <div class="main-grid">
      <!-- Code Execution Panel -->
      <div class="panel">
        <h2>⚙️ Execute Code</h2>
        <div class="form-group">
          <label>JavaScript Code</label>
          <textarea id="codeInput" placeholder="Enter JavaScript code..."></textarea>
        </div>
        <button id="executeCode" onclick="executeCode()">Execute</button>
        <div id="codeOutput" class="output"></div>
      </div>

      <!-- Diagnostics Panel -->
      <div class="panel">
        <h2>📊 Diagnostics</h2>
        <button onclick="runDiagnostics()" style="margin-bottom: 15px;">Run Diagnostics</button>
        <button onclick="viewLogs()" style="margin-bottom: 15px; background: #6b7280;">View Error Logs</button>
        <div id="diagnosticsOutput" class="output"></div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-item">
        <div class="status-label">Ollama Status</div>
        <div id="ollamaStatus" class="status-value">Checking...</div>
      </div>
      <div class="status-item">
        <div class="status-label">GitHub Connected</div>
        <div id="githubStatus" class="status-value error">Not configured</div>
      </div>
      <div class="status-item">
        <div class="status-label">File System Access</div>
        <div id="filesystemStatus" class="status-value">Ready</div>
      </div>
    </div>
  </div>

  <script>
    async function sendChat() {
      const input = document.getElementById('chatInput').value.trim();
      if (!input) return;

      const output = document.getElementById('chatOutput');
      output.textContent = '⏳ Thinking...';
      output.className = 'output';

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: input })
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
        output.className = 'output success';
        document.getElementById('chatInput').value = '';
      } catch (err) {
        output.textContent = '❌ Error: ' + err.message;
        output.className = 'output error';
      }
    }

    async function generateImage() {
      const prompt = document.getElementById('imagePrompt').value.trim();
      if (!prompt) return;

      const output = document.getElementById('imageOutput');
      output.textContent = '🎨 Generating image...';
      output.className = 'output';

      try {
        const res = await fetch('/image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
        output.className = 'output success';
      } catch (err) {
        output.textContent = '❌ Error: ' + err.message;
        output.className = 'output error';
      }
    }

    async function executeCode() {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return;

      const output = document.getElementById('codeOutput');
      output.textContent = '⚙️ Executing...';
      output.className = 'output';

      try {
        const res = await fetch('/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
        output.className = 'output success';
      } catch (err) {
        output.textContent = '❌ Error: ' + err.message;
        output.className = 'output error';
      }
    }

    async function runDiagnostics() {
      const output = document.getElementById('diagnosticsOutput');
      output.textContent = '📊 Running diagnostics...';
      output.className = 'output';

      try {
        const res = await fetch('/diagnostics', { method: 'POST' });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
        output.className = 'output success';
      } catch (err) {
        output.textContent = '❌ Error: ' + err.message;
        output.className = 'output error';
      }
    }

    async function viewLogs() {
      const output = document.getElementById('diagnosticsOutput');
      output.textContent = '📜 Loading logs...';
      output.className = 'output';

      try {
        const res = await fetch('/logs');
        const text = await res.text();
        output.textContent = text || '(No logs yet)';
        output.className = 'output';
      } catch (err) {
        output.textContent = '❌ Error: ' + err.message;
        output.className = 'output error';
      }
    }

    // Check Ollama on load
    window.onload = async () => {
      try {
        const res = await fetch('http://localhost:11434/api/tags');
        document.getElementById('ollamaStatus').textContent = '✓ Connected';
        document.getElementById('ollamaStatus').className = 'status-value';
      } catch (err) {
        document.getElementById('ollamaStatus').textContent = '✗ Offline';
        document.getElementById('ollamaStatus').className = 'status-value error';
      }
    };

    // Allow Enter key in textarea
    document.getElementById('chatInput').onkeypress = (e) => {
      if (e.key === 'Enter' && e.ctrlKey) sendChat();
    };
  </script>
</body>
</html>
