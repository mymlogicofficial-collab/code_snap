<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSnap Agent</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="CodeSnap header">
      <div class="brand-mark" aria-hidden="true">🛠</div>
      <div class="brand-copy">
        <h1 class="brand-title">CodeSnap Agent</h1>
      </div>
    </header>

    <p class="subhead">Ollamated Design &amp; Development System</p>

    <main class="cards-grid" aria-label="Agent tools">
      <section class="panel" aria-label="Chat panel">
        <div class="panel-header">
          <span class="panel-title"><span class="icon" aria-hidden="true">💬</span> Chat</span>
        </div>
        <label class="field-label" for="chatInput">Message</label>
        <textarea id="chatInput" placeholder="Ask me anything..."></textarea>
        <button id="sendChat" class="primary-button" type="button">Send Message</button>
        <div id="chatOutput" class="output-panel"></div>
      </section>

      <section class="panel" aria-label="Image generator panel">
        <div class="panel-header">
          <span class="panel-title"><span class="icon" aria-hidden="true">🖼️</span> Image Generator</span>
        </div>
        <label class="field-label" for="imagePrompt">Prompt</label>
        <textarea id="imagePrompt" placeholder="Describe the image you want..."></textarea>
        <button id="generateImage" class="primary-button" type="button">Generate Image</button>
        <div id="imageOutput" class="output-panel"></div>
      </section>

      <section class="panel" aria-label="Code execution panel">
        <div class="panel-header">
          <span class="panel-title"><span class="icon" aria-hidden="true">⚙️</span> Execute Code</span>
        </div>
        <label class="field-label" for="codeInput">JavaScript Code</label>
        <textarea id="codeInput" placeholder="Enter JavaScript code...">console.log('CodeSnap ready');</textarea>
        <button id="executeCode" class="primary-button" type="button">Execute</button>
        <div id="codeOutput" class="output-panel"></div>
      </section>

      <section class="panel" aria-label="Diagnostics panel">
        <div class="panel-header">
          <span class="panel-title"><span class="icon" aria-hidden="true">🩺</span> Diagnostics</span>
        </div>
        <div class="button-row">
          <button id="runDiagnostics" class="secondary-button" type="button">Run Diagnostics</button>
          <button id="viewLogs" class="secondary-button muted-button" type="button">View Error Logs</button>
        </div>
        <div id="diagnosticsOutput" class="output-panel diagnostics-output"></div>
      </section>
    </main>

    <section class="media-grid" aria-label="Media generation tools">
      <div class="panel media-panel">
        <div class="panel-header">
          <span class="panel-title"><span class="icon" aria-hidden="true">🎵</span> Music / Audio</span>
        </div>
        <label class="field-label" for="musicPrompt">Prompt</label>
        <textarea id="musicPrompt" placeholder="Generate a clean lo-fi instrumental or spoken-word track..."></textarea>
        <div class="button-row compact-row">
          <button id="generateMusic" class="primary-button" type="button">Generate Music</button>
          <button id="previewMusic" class="secondary-button" type="button">Preview</button>
        </div>
      </div>

      <div class="panel media-panel">
        <div class="panel-header">
          <span class="panel-title"><span class="icon" aria-hidden="true">🎬</span> Video</span>
        </div>
        <label class="field-label" for="videoPrompt">Prompt</label>
        <textarea id="videoPrompt" placeholder="Create a cinematic 10-second product reveal or motion storyboard..."></textarea>
        <div class="button-row compact-row">
          <button id="generateVideo" class="primary-button" type="button">Generate Video</button>
          <button id="previewVideo" class="secondary-button" type="button">Storyboard</button>
        </div>
      </div>
    </section>

    <div class="status-row" aria-label="System statuses">
      <div class="status-pill success"><span class="dot" aria-hidden="true"></span><span id="ollamaStatus">Checking...</span></div>
      <div class="status-pill warning"><span class="dot" aria-hidden="true"></span><span id="githubStatus">Checking...</span></div>
      <div class="status-pill success"><span class="dot" aria-hidden="true"></span><span id="filesystemStatus">Checking...</span></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
