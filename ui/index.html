<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeSnap Agent</title>
  <style>
    :root {
      --bg: #020b16;
      --bg-2: #09182a;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-strong: rgba(13, 19, 32, 0.95);
      --panel-soft: rgba(19, 29, 45, 0.8);
      --border: rgba(148, 163, 184, 0.18);
      --text: #edf3ff;
      --muted: #b0bfd8;
      --muted-2: #5f7a9d;
      --primary: #6f67ff;
      --primary-2: #8f7dff;
      --primary-3: #7b9cff;
      --green: #2ee6a6;
      --green-soft: rgba(46, 230, 166, 0.1);
      --red: #ef5a5a;
      --red-soft: rgba(239, 90, 90, 0.12);
      --blue-soft: rgba(96, 165, 250, 0.08);
      --shadow: 0 18px 40px rgba(2, 6, 23, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #030b16 0%, #040d1a 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      padding: 28px 28px 40px;
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: #eaf4ff;
      font-size: 18px;
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .brand-title {
      font-size: 22px;
      letter-spacing: -0.04em;
      font-weight: 800;
      margin: 0;
      line-height: 1.1;
    }

    .subhead {
      margin: 0;
      color: rgba(192, 207, 228, 0.82);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px 22px;
      margin-top: 10px;
    }

    .card {
      background: rgba(11, 18, 30, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      padding: 2px 0 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-header .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      font-size: 18px;
      filter: saturate(1.1);
    }

    .field-label {
      display: block;
      font-size: 12px;
      color: rgba(189, 204, 225, 0.82);
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      background: rgba(7, 13, 22, 0.9);
      color: var(--text);
      font: inherit;
      outline: none;
      resize: vertical;
    }

    textarea {
      min-height: 140px;
      padding: 14px 14px 12px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(222, 234, 255, 0.92);
    }

    .full-btn {
      width: 100%;
      border: 0;
      margin-top: 16px;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #6f67ff 0%, #7d76ff 100%);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(111, 103, 255, 0.26);
    }

    .inline-row {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .secondary-btn {
      flex: 1;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(148, 163, 184, 0.08);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .spinner-micro {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.28);
      border-top-color: rgba(255,255,255,0.85);
      display: inline-block;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(14, 25, 38, 0.7);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .status-pill .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 9px;
      background: var(--green);
      box-shadow: 0 0 12px rgba(46, 230, 166, 0.8);
    }

    .status-pill.warning {
      color: #ffce7a;
      background: rgba(255, 190, 64, 0.06);
      border-color: rgba(251, 191, 36, 0.18);
    }

    .status-pill.warning .dot {
      background: #fbbf24;
      box-shadow: 0 0 10px rgba(251, 191, 36, 0.75);
    }

    .status-pill.error {
      color: #ff9f9f;
      background: rgba(239, 90, 90, 0.06);
      border-color: rgba(239, 90, 90, 0.18);
    }

    .status-pill.error .dot {
      background: var(--red);
      box-shadow: 0 0 10px rgba(239, 90, 90, 0.7);
    }

    @media (max-width: 980px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .status-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="Brand header">
      <div class="brand-mark" aria-hidden="true">🛠</div>
      <div>
        <h1 class="brand-title">CodeSnap Agent</h1>
      </div>
    </header>

    <p class="subhead">Ollamated Design &amp; Development System</p>

    <main class="cards" aria-label="Agent tools">
      <section class="card" aria-label="Chat panel">
        <div class="card-header"><span class="icon" aria-hidden="true">💬</span><span>Chat</span></div>
        <label class="field-label" for="chatInput">Message</label>
        <textarea id="chatInput" placeholder="Ask me anything..."></textarea>
        <button class="full-btn" type="button">Send Message</button>
      </section>

      <section class="card" aria-label="Image generator panel">
        <div class="card-header"><span class="icon" aria-hidden="true">🖼️</span><span>Image Generator</span></div>
        <label class="field-label" for="imagePrompt">Prompt</label>
        <textarea id="imagePrompt" placeholder="Describe the image you want..."></textarea>
        <button class="full-btn" type="button">Generate Image</button>
      </section>

      <section class="card" aria-label="Execute code panel">
        <div class="card-header"><span class="icon" aria-hidden="true">⚙️</span><span>Execute Code</span></div>
        <label class="field-label" for="codeInput">JavaScript Code</label>
        <textarea id="codeInput" placeholder="Enter JavaScript code..."></textarea>
        <button class="full-btn" type="button">Execute</button>
      </section>

      <section class="card" aria-label="Diagnostics panel">
        <div class="card-header"><span class="icon" aria-hidden="true">🩺</span><span>Diagnostics</span></div>
        <div class="inline-row">
          <button class="secondary-btn" type="button">Run Diagnostics</button>
          <button class="secondary-btn" type="button">View Error Logs</button>
        </div>
        <div style="margin-top: 18px; min-height: 132px; background: rgba(7,13,22,0.94); border: 1px solid rgba(148,163,184,0.18); border-radius: 12px;"></div>
      </section>
    </main>

    <div class="status-row" aria-label="System status">
      <div class="status-pill"><span class="dot" aria-hidden="true"></span>Ollama Status</div>
      <div class="status-pill warning"><span class="dot" aria-hidden="true"></span>GitHub Connected</div>
      <div class="status-pill"><span class="dot" aria-hidden="true"></span>File System Access</div>
    </div>
  </div>
</body>
</html>
