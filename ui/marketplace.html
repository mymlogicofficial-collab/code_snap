<!DOCTYPE html>
<html>
<head>
  <title>Skill Marketplace · CodeSnap Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="market">
    <h1>Skill Marketplace</h1>
    <p>Generate and install new skills for your agent.</p>

    <div id="creator">
      <input id="skillName" placeholder="Skill name" />
      <input id="skillDesc" placeholder="Skill description" />
      <button id="createSkill">Create Skill</button>
    </div>

    <pre id="marketOutput"></pre>
  </div>

  <script src="marketplace.js"></script>
</body>
</html>
